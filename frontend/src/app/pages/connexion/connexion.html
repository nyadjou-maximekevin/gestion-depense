<div class="auth-card carte">
  <div class="logo"><span>€</span> Gestion de dépenses</div>

  <div class="entete">
    <h1>Bon retour 👋</h1>
    <p>Connecte-toi pour suivre tes dépenses.</p>
  </div>

  @if (erreur()) {
    <div class="alerte-erreur" role="alert">{{ erreur() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="envoyer()" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="toi@exemple.com"
        [class.invalide]="invalide('email')"
      >
      @if (invalide('email')) {
        <span class="aide-erreur">Entre une adresse email valide.</span>
      }
    </div>

    <div class="field">
      <label for="motDePasse">Mot de passe</label>
      <input
        id="motDePasse"
        type="password"
        formControlName="motDePasse"
        autocomplete="current-password"
        placeholder="••••••••"
        [class.invalide]="invalide('motDePasse')"
      >
      @if (invalide('motDePasse')) {
        <span class="aide-erreur">Le mot de passe est obligatoire.</span>
      }
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="enCours()">
      {{ enCours() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>

  <p class="bas">
    Pas encore de compte ? <a routerLink="/inscription">Créer un compte</a>
  </p>
</div>
