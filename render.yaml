# Blueprint Render : déploie l'API NestJS (dossier backend/)
services:
  - type: web
    name: gestion-depenses-api
    runtime: node
    plan: free
    region: frankfurt # même région que la base Neon
    rootDir: backend
    # --include=dev : NODE_ENV=production ferait sauter les devDependencies (dont la CLI nest)
    # test -f : fait échouer le déploiement si la compilation a produit un dossier vide
    buildCommand: npm ci --include=dev && npm run build && test -f dist/main.js
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # À saisir dans le tableau de bord Render (jamais dans le code)
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Clé JWT de production, générée aléatoirement par Render
      - key: JWT_SECRET
        generateValue: true
